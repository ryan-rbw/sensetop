[metadata]
name = sensetop
version = attr: sensetop.__version__
author = Ryan RBW
author_email = ryan@example.com
description = Real-time monitoring application for Sense HAT on Raspberry Pi 5
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ryan-rbw/sensetop
project_urls =
    Bug Tracker = https://github.com/ryan-rbw/sensetop/issues
    Documentation = https://github.com/ryan-rbw/sensetop/blob/master/README.md
    Source Code = https://github.com/ryan-rbw/sensetop
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    License :: OSI Approved :: MIT License
    Operating System :: POSIX :: Linux
    Environment :: Console :: Curses
    Development Status :: 3 - Alpha
    Intended Audience :: System Administrators
    Intended Audience :: Developers
    Topic :: System :: Monitoring
    Topic :: Utilities

[options]
packages = find:
python_requires = >=3.8
install_requires =
    sense-hat>=2.2.0
    smbus2>=0.4.1
    numpy>=1.19.0
    pytz>=2021.1

[options.packages.find]
where = .
include = sensetop*

[options.entry_points]
console_scripts =
    sensetop = sensetop.main:main

[options.extras_require]
dev =
    pytest>=6.0
    pytest-cov>=2.12.0
    pytest-asyncio>=0.18.0
    mypy>=0.910
    pylint>=2.10.0
    flake8>=4.0.0
    black>=21.9b0
    isort>=5.9.0
viz =
    plotext>=5.0.0
docs =
    sphinx>=4.0.0
    sphinx-rtd-theme>=1.0.0

[bdist_wheel]
universal = 0

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,__pycache__,.pytest_cache,.mypy_cache,.venv,build,dist,*.egg-info

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v --cov=sensetop --cov-report=html --cov-report=term

[coverage:run]
source = sensetop
branch = True
omit =
    */site-packages/*
    */distutils/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    class .*\bProtocol\):
    @abstractmethod
