name: Release & Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # Required for trusted publishing to PyPI/TestPyPI

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write  # Required for trusted publishing

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for changelog generation

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

    - name: Build distribution packages
      run: |
        python -m pip install --upgrade pip setuptools wheel build
        python -m build

    - name: Display build artifacts
      run: ls -lh dist/

    - name: Generate changelog from commits
      id: changelog
      run: |
        CHANGELOG=$(git log --oneline $(git describe --tags --abbrev=0 HEAD^)..HEAD 2>/dev/null || git log --oneline -10)
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGELOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ github.ref_name }}
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## Changes in ${{ steps.version.outputs.version }}

          ### Commits
          ${{ steps.changelog.outputs.changelog }}

          ### Installation
          Install from PyPI:
          ```bash
          pip install sensetop==${{ steps.version.outputs.version }}
          ```

          Or install from source:
          ```bash
          tar xzf sensetop-${{ steps.version.outputs.version }}.tar.gz
          cd sensetop-${{ steps.version.outputs.version }}
          pip install .
          ```

          ### Release Artifacts
          - `sensetop-${{ steps.version.outputs.version }}-py3-none-any.whl` - Python wheel distribution
          - `sensetop-${{ steps.version.outputs.version }}.tar.gz` - Source distribution
        artifacts: dist/*
        draft: false
        prerelease: false

    # TestPyPI publishing disabled - trusted publishing not configured yet
