  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release]
    if: always()

    steps:
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Create release summary
      run: |
        echo "✅ Release ${{ steps.version.outputs.version }} completed successfully!"
        echo "📦 Available on PyPI: https://pypi.org/project/sensetop/"
        echo "📚 GitHub Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo "✨ Install with: pip install sensetop==${{ steps.version.outputs.version }}"
