name: Lint & Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 black isort mypy

    - name: Run pylint
      run: pylint sensetop/ tests/ --exit-zero

    - name: Run flake8
      run: flake8 sensetop/ tests/

    - name: Check code formatting with black
      run: black --check sensetop/ tests/

    - name: Check import sorting with isort
      run: isort --check-only sensetop/ tests/

    - name: Run mypy type checking
      run: mypy sensetop/ --ignore-missing-imports --exit-code 0
