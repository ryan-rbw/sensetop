name: Lint & Code Quality

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Display Python version
      run: python -c "import sys; print(sys.version)"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 black isort mypy

    - name: Run pylint
      run: |
        echo "Running pylint..."
        pylint sensetop/ tests/ --exit-zero || true

    - name: Run flake8
      run: |
        echo "Running flake8..."
        flake8 sensetop/ tests/ || true

    - name: Check code formatting with black
      run: |
        echo "Checking black formatting..."
        black --check sensetop/ tests/ || (echo "Run 'black sensetop/ tests/' to fix formatting" && false)

    - name: Check import sorting with isort
      run: |
        echo "Checking isort import sorting..."
        isort --check-only sensetop/ tests/ || (echo "Run 'isort sensetop/ tests/' to fix imports" && false)

    - name: Run mypy type checking
      run: |
        echo "Running mypy type checking..."
        mypy sensetop/ --ignore-missing-imports --exit-code 0 || true

    - name: Lint Summary
      if: always()
      run: |
        echo "✅ Code quality checks completed"
