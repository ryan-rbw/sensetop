[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "sensetop"
dynamic = ["version"]
description = "Real-time monitoring application for Sense HAT on Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ryan RBW", email = "ryan@example.com"}
]
keywords = [
    "sense-hat",
    "monitoring",
    "raspberry-pi",
    "sensor",
    "terminal-ui",
    "curses",
    "real-time"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]
dependencies = [
    "sense-hat>=2.2.0",
    "smbus2>=0.4.1",
    "numpy>=1.19.0",
    "pytz>=2021.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.12.0",
    "pytest-asyncio>=0.18.0",
    "mypy>=0.910",
    "pylint>=2.10.0",
    "flake8>=4.0.0",
    "black>=21.9b0",
    "isort>=5.9.0"
]
viz = [
    "plotext>=5.0.0"
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/ryan-rbw/sensetop"
"Bug Tracker" = "https://github.com/ryan-rbw/sensetop/issues"
Documentation = "https://github.com/ryan-rbw/sensetop/blob/master/README.md"
"Source Code" = "https://github.com/ryan-rbw/sensetop"

[project.scripts]
sensetop = "sensetop.main:main"

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "build/", "dist/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v --cov=sensetop --cov-report=html --cov-report=term --cov-fail-under=60"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.coverage.run]
source = ["sensetop"]
branch = true
omit = [
    "*/site-packages/*",
    "*/distutils/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@abstractmethod"
]
